<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Space War Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game" id="game">

        <div class="score" id="score">
            Score: 0
        </div>

        <div class="player" id="player">
            <img src="ship.png" alt="Ship">
        </div>

        <div class="alien" id="alien">
            <img src="alien.png" alt="Alien">
        </div>

        <div class="gameOver" id="gameOver">
            GAME OVER
            <br>
            <button onclick="location.reload()">Restart</button>

        </div>

    </div>

    <div class="mobileControls">

        <button id="leftBtn" class="controlBtn">◀</button>
        <button id="fireBtn" class="fireBtn">Shoot</button>
        <button id="rightBtn" class="controlBtn">▶</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
